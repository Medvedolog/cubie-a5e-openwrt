name: Cubie A5E official-base snapshot (hybrid NVMe installer)

on:
  push:
    branches: [work/a5e-official-nvme-installer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-a5e-nvme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-a5e:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare OpenWrt build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison \
            gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget zstd \
            ccache device-tree-compiler mtools fdisk gdisk parted dosfstools u-boot-tools libxml-parser-perl e2fsprogs
          # Avoid the host U-Boot dtc/libyaml conflict seen in this repo.
          if dpkg -s libyaml-dev >/dev/null 2>&1; then
            sudo apt-get remove -y libyaml-dev
          fi
      - name: Test LuCI image checker with ext4 fixtures
        run: |
          python3 scripts/tests/test_check_official_aic8800.py
          python3 scripts/tests/test_make_a5e_nvme_installer.py
          sh -n files/usr/sbin/a5e-install-nvme
      - name: Fetch and verify the exact Armbian-based loader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          donor="$RUNNER_TEMP/a5e-armbian-donor"
          mkdir "$donor"
          for attempt in 1 2 3; do
            if gh api -H 'Accept: application/octet-stream' \
                'repos/Medvedolog/cubie-a5e-openwrt/releases/assets/718297395?download=1' \
                > "$donor/armbian-u-boot-sunxi-with-spl.bin"; then break; fi
            [[ "$attempt" -lt 3 ]] || exit 1
            sleep 3
          done
          (
            cd "$donor"
            echo '99ad69e2ededdf66fb15accfa003c1ec5986807e50d11d544c17c074682c6e98  armbian-u-boot-sunxi-with-spl.bin' | sha256sum --strict -c
            test "$(wc -c < armbian-u-boot-sunxi-with-spl.bin)" -eq 926161
          )
      - name: Build pinned OpenWrt image with native NVMe root and SPI support
        env:
          A5E_NVME_INSTALLER: "1"
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
          OPENWRT_BUILD_ROOT: ${{ runner.temp }}/a5e-official-build
          OPENWRT_ARTIFACT_ROOT: ${{ github.workspace }}/build-official-a5e
        run: bash scripts/build-official-aic8800.sh pwrseq-950
      - name: Create and inspect offline microSD/NVMe images
        run: |
          set -euo pipefail
          donor="$RUNNER_TEMP/a5e-armbian-donor"
          shopt -s nullglob
          base=(build-official-a5e/pwrseq-950/*radxa_cubie-a5e-ext4-sdcard.img.gz)
          [[ ${#base[@]} -eq 1 ]]
          python3 scripts/make-a5e-nvme-installer.py \
            --openwrt "${base[0]}" --uboot "$donor/armbian-u-boot-sunxi-with-spl.bin" \
            --out build-official-a5e/nvme-installer
          (cd build-official-a5e/nvme-installer && sha256sum --strict -c SHA256SUMS)
      - name: Upload verified installer bundle (hardware not tested)
        uses: actions/upload-artifact@v4
        with:
          name: a5e-r38527-hybrid-nvme-installer-UNTESTED
          path: build-official-a5e/nvme-installer/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload tested structure and untested binaries
        uses: actions/upload-artifact@v4
        with:
          name: a5e-r38527-nvme-base-UNTESTED
          path: build-official-a5e/pwrseq-950/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload matching ImageBuilder
        uses: actions/upload-artifact@v4
        with:
          name: a5e-r38527-nvme-imagebuilder
          path: build-official-a5e/imagebuilder/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload exact signed APK feed
        uses: actions/upload-artifact@v4
        with:
          name: a5e-r38527-nvme-signed-feed
          path: build-official-a5e/signed-feed/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload available build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5e-r38527-nvme-build-logs
          path: ${{ runner.temp }}/a5e-official-build/logs/
          if-no-files-found: ignore
          retention-days: 7

  publish-a5e-prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/a5e-official-nvme-installer' && github.repository == 'Medvedolog/cubie-a5e-openwrt'
    needs: build-a5e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: a5e-r38527-nvme-base-UNTESTED
          path: verified-build/images
      - uses: actions/download-artifact@v4
        with:
          name: a5e-r38527-nvme-imagebuilder
          path: verified-build/imagebuilder
      - uses: actions/download-artifact@v4
        with:
          name: a5e-r38527-nvme-signed-feed
          path: verified-build/feed
      - uses: actions/download-artifact@v4
        with:
          name: a5e-r38527-hybrid-nvme-installer-UNTESTED
          path: verified-build/installer
      - name: Publish matching signed feed and bilingual NVMe prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-official-nvme-installer.sh verified-build/images verified-build/imagebuilder verified-build/feed verified-build/installer
