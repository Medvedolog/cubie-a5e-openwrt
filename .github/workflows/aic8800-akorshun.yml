name: Build AIC8800 for akorshun OpenWrt 25.12.5
# Separate compatibility artifacts, never mixed into our Linux 6.18 feed.
on:
  push:
    paths:
      - 'package/aic8800-recovery/**'
      - 'package/kernel/aic8800/**'
      - 'files/lib/aic8800.sh'
      - 'files/usr/sbin/aic8800-recover'
      - '.github/workflows/aic8800-akorshun.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akorshun-aic8800-${{ github.ref }}
  cancel-in-progress: false

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.5/targets/sunxi/cortexa53/openwrt-sdk-25.12.5-sunxi-cortexa53_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_SHA256: 4704c42edc42efbfb9822c74f3be42d67d7aa859ec92fb9fa58526bc6c0d432e
  SDK_DIR: openwrt-sdk-25.12.5-sunxi-cortexa53_gcc-14.3.0_musl.Linux-x86_64
  KERNEL_ABI: 54c42a9af64da421c37305c250430d94
  AK_AIC_SOURCE: 192b916cceff71afde4680a16cbf64218c26449f

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            python3 python3-pyelftools rsync swig unzip zlib1g-dev file wget zstd \
            ccache libelf-dev libdw-dev liblz4-dev libzstd-dev libxml-parser-perl

      - name: Prepare isolated compatibility feed
        run: |
          git clone --quiet https://github.com/akorshun/aic8800-openwrt.git vendor-source
          git -C vendor-source checkout --quiet "$AK_AIC_SOURCE"
          mkdir -p compat-feed
          cp -a vendor-source/package/aic8800 compat-feed/
          cp -a package/aic8800-recovery compat-feed/
          # Our MMC clock patch, not in akorshun r4. The akorshun 090
          # FORTIFY patch is retained unchanged.
          cp package/kernel/aic8800/patches/090-sdio-respect-mmc-clock.patch \
            compat-feed/aic8800/patches/100-sdio-respect-mmc-clock.patch
          sed -i 's/^PKG_RELEASE:=4$/PKG_RELEASE:=7/' compat-feed/aic8800/Makefile
          grep -qx 'PKG_RELEASE:=7' compat-feed/aic8800/Makefile
          test -s compat-feed/aic8800/patches/090-sdio-rx-fortify-radiotap.patch
          for p in 020-wireless-6.16 030-update-firmware-path 050-log-level \
                   080-fix-export-symbols-conflict; do
            grep -qU $'\r' "compat-feed/aic8800/patches/$p.patch" || exit 1
          done

      - name: Fetch pinned SDK
        run: |
          curl -fsSL --retry 3 -o sdk.tar.zst "$SDK_URL"
          echo "$SDK_SHA256  sdk.tar.zst" | sha256sum -c -
          tar --zstd -xf sdk.tar.zst
          test -d "$SDK_DIR"

      - name: Configure feeds and packages
        run: |
          cd "$SDK_DIR"
          cp feeds.conf.default feeds.conf
          echo "src-link compat ${GITHUB_WORKSPACE}/compat-feed" >> feeds.conf
          for n in 1 2 3; do
            if ./scripts/feeds update -a; then break; fi
            rm -rf feeds
            sleep 20
          done
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_PACKAGE_kmod-aic8800-sdio=m
          CONFIG_PACKAGE_aic8800-sdio-firmware=m
          CONFIG_PACKAGE_aic8800-recovery=m
          CONFIG_BUILD_LOG=y
          # CONFIG_AIC8800_SDIO_BT_SUPPORT is not set
          # CONFIG_PACKAGE_kmod-aic8800-pcie is not set
          # CONFIG_PACKAGE_kmod-aic8800-usb is not set
          # CONFIG_PACKAGE_kmod-aic8800-btusb is not set
          # CONFIG_PACKAGE_aic8800-pcie-firmware is not set
          # CONFIG_PACKAGE_aic8800-usb-firmware is not set
          EOF
          make defconfig
          grep -qE '^CONFIG_PACKAGE_kmod-aic8800-sdio=[ym]' .config
          grep -qE '^CONFIG_PACKAGE_aic8800-recovery=[ym]' .config

      - name: Compile standalone packages
        run: |
          cd "$SDK_DIR"
          make package/feeds/compat/aic8800/compile -j"$(nproc)" V=s
          make package/feeds/compat/aic8800-recovery/compile -j"$(nproc)" V=s

      - name: Strict ABI and artifact checks
        run: |
          cd "$SDK_DIR"
          ACTUAL=$(grep LINUX_VERMAGIC include/kernel.mk | grep -oE '[0-9a-f]{32}' | head -1)
          test "$ACTUAL" = "$KERNEL_ABI"
          mkdir -p ../artifacts
          find bin -name 'kmod-aic8800-sdio-*.apk' -o -name 'aic8800-sdio-firmware-*.apk' \
            -o -name 'aic8800-recovery-*.apk' | while read -r f; do cp -v "$f" ../artifacts/; done
          for p in kmod-aic8800-sdio aic8800-sdio-firmware aic8800-recovery; do
            find ../artifacts -name "$p-*.apk" | grep -q .
          done
          for m in aic8800_bsp aic8800_fdrv; do
            f=$(find build_dir -name "$m.ko" | head -1)
            test -n "$f"
            strings "$f" | grep '^vermagic=' | grep -q '6.12.94'
          done
          printf 'Base: akorshun/OpenWrt 25.12.5 build-20-sc1ee\nKernel: 6.12.94-1-%s\nAIC packaging: akorshun/aic8800-openwrt %s plus Medvedolog MMC clock\n' \
            "$KERNEL_ABI" "$AK_AIC_SOURCE" > ../artifacts/BUILD-INFO.txt
          (cd ../artifacts && sha256sum *.apk > sha256sums)

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aic8800-akorshun-25.12.5
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: aic8800-akorshun-build-logs
          path: |
            ${{ env.SDK_DIR }}/logs/
            ${{ env.SDK_DIR }}/.config
          if-no-files-found: ignore
