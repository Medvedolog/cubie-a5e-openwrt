name: Build image (OpenWrt from source)

# OpenWrt main has no Allwinner A527 yet. The A527/T527 support (sunxi
# cortexa55 subtarget, radxa_cubie-a5e profile, TF-A, U-Boot) is in the
# open pull request openwrt/openwrt#23296 by the sunxi maintainer; the
# image is built from that branch at a fixed commit, with:
#   target/, package/        files added to the tree (Wi-Fi power
#                            sequence DTS patch, U-Boot DRAM fallback,
#                            the aic8800 package)
#   patches/openwrt/*.patch  changes to files of the tree
#   config/diffconfig        the build configuration
# See docs/PORTING-NOTES.md for where each part comes from.
#
# Signing: the secret APK_SIGN_KEY (EC P-256 private key, PEM) signs the
# packages and the index. Without it the build makes a throw-away key and
# the result is a test build only.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'target/**'
      - 'package/**'
      - 'patches/**'
      - 'config/**'
      - 'files/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: Where the build runs
        type: choice
        options: [github, self-hosted]
        default: github
      openwrt_commit:
        description: OpenWrt commit to build instead of the pinned one (test only)
        type: string
        default: ''
      clean_ccache:
        description: Start without the compiler cache
        type: boolean
        default: false

# a build takes hours: a new push waits for the running build instead of
# cancelling it (only the newest waiting run is kept)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  # openwrt/openwrt#23296 "sunxi: add support for A527/T527 boards"
  # (Zoltan Herpai), head of 2026-09-27 "sunxi: add support for Avaota A1",
  # on main of 2026-09-25: Linux 6.18.52, U-Boot 2026.04, TF-A 2.14
  OPENWRT_PR: 23296
  OPENWRT_COMMIT: 5035e7d51ae54590309cbcf36e638c783e7a0557
  TARGET: sunxi
  SUBTARGET: cortexa55
  ARCH_PACKAGES: aarch64_cortex-a55
  PROFILE: radxa_cubie-a5e
  DTB: sun55i-a527-cubie-a5e

jobs:
  build:
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (GitHub runner)
        if: inputs.runner != 'self-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget \
            zstd ccache device-tree-compiler mtools fdisk u-boot-tools
          # U-Boot's host dtc links libyaml when the host has it and then
          # fails against OpenWrt's host flags (run 4); OpenWrt's build
          # hosts do not have it either
          if dpkg -s libyaml-dev >/dev/null 2>&1; then
            sudo apt-get remove -y libyaml-dev
          fi

      - name: OpenWrt sources
        id: src
        run: |
          COMMIT=${{ inputs.openwrt_commit }}
          COMMIT=${COMMIT:-$OPENWRT_COMMIT}
          rm -rf openwrt
          git init -q openwrt
          git -C openwrt remote add origin "$OPENWRT_REPO"
          # a commit of a pull request is fetched by its id; if GitHub
          # refuses that, through the pull request's head
          git -C openwrt fetch -q --depth 1 origin "$COMMIT" ||
            git -C openwrt fetch -q --depth 50 origin "refs/pull/$OPENWRT_PR/head"
          git -C openwrt checkout -q "$COMMIT" 2>/dev/null ||
          git -C openwrt checkout -q FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = "$COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          git -C openwrt log -1 --format='OpenWrt %H %cd %s'
          grep -H . openwrt/target/linux/generic/kernel-6.18
          grep -E '^KERNEL_PATCHVER' openwrt/target/linux/sunxi/Makefile

      - name: Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # the feed revisions of this build (feeds.conf.default follows
          # the branch heads; the exact commits go into build-info.txt)
          for d in feeds/*/; do
            [ -d "$d/.git" ] || continue
            echo "feed $(basename "$d") $(git -C "$d" rev-parse HEAD)"
          done | tee ../feeds.revisions

      - name: Our patches and packages
        working-directory: openwrt
        run: |
          # added files only: nothing of ours may replace an OpenWrt file
          clash=$(cd .. && find target package files -type f | while read -r f; do
            if [ -e "openwrt/$f" ]; then echo "$f"; fi; done)
          if [ -n "$clash" ]; then echo "would overwrite: $clash"; exit 1; fi
          cp -a ../target ../package ../files .
          # Validate both POSIX/ash scripts before embedding them in the firmware.
          sh -n files/lib/aic8800.sh
          sh -n files/usr/sbin/aic8800-recover
          # GitHub Contents API stores new scripts as 0644; set executable bit in image.
          chmod 0755 files/usr/sbin/aic8800-recover
          # Show test users exactly where the driver and OpenWrt package came from.
          # Derived from the Makefile in this build, not from a stale README.
          {
            echo "Driver upstream: https://github.com/radxa-pkg/aic8800"
            echo "Packaging baseline: ImmortalWrt aic8800 r5"
            echo "Packaging upstream: https://github.com/immortalwrt/immortalwrt/tree/master/package/kernel/aic8800"
            echo "Additional SDIO radiotap patch: akorshun/aic8800-openwrt (original 090)"
            grep -E '^PKG_(NAME|RELEASE|SOURCE_DATE|SOURCE_VERSION):=' package/kernel/aic8800/Makefile
            echo "Local patches:"
            for patch in package/kernel/aic8800/patches/*.patch; do
              echo "  ${patch##*/}"
            done
          } > files/etc/aic8800-origin
          for p in ../patches/openwrt/*.patch; do
            echo "applying ${p##*/}"
            git apply --whitespace=nowarn "$p"
          done
          git status --short | head -100

      - name: Configure
        working-directory: openwrt
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          if [ -n "$APK_SIGN_KEY" ]; then
            ( umask 077; printf '%s\n' "$APK_SIGN_KEY" > private-key.pem )
            openssl ec -in private-key.pem -pubout > public-key.pem 2>/dev/null
            echo "APK_SIGN_KEY: $(sha256sum public-key.pem | cut -c1-12)"
          else
            echo "::warning::APK_SIGN_KEY not set: the build makes a throw-away key"
          fi
          cp ../config/diffconfig .config
          make defconfig
          grep -qx '# CONFIG_TARGET_ROOTFS_INITRAMFS is not set' .config || {
            echo 'ERROR: initramfs must be disabled in normal SD images'
            exit 1
          }
          ./scripts/diffconfig.sh > ../diffconfig.effective
          # what has to survive defconfig
          for c in CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_$PROFILE CONFIG_CCACHE \
                   CONFIG_PACKAGE_kmod-aic8800-sdio CONFIG_PACKAGE_aic8800-sdio-firmware \
                   CONFIG_PACKAGE_kmod-nvme CONFIG_PACKAGE_wpad-mbedtls \
                   CONFIG_PACKAGE_u-boot-radxa-cubie-a5e \
                   CONFIG_PACKAGE_trusted-firmware-a-sunxi-a523; do
            grep -qx "$c=y" .config || { echo "missing after defconfig: $c"; exit 1; }
          done
          if grep -qx 'CONFIG_AIC8800_SDIO_BT_SUPPORT=y' .config; then
            echo "AIC8800 Bluetooth must stay off"; exit 1; fi
          for p in mwan3 luci-app-mwan3 watchcat luci-app-watchcat nlbwmon luci-app-nlbwmon; do
            if grep -qx "CONFIG_PACKAGE_$p=y" .config; then echo "not allowed: $p"; exit 1; fi
          done

      - name: Download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ steps.src.outputs.commit }}-${{ hashFiles('config/diffconfig', 'package/**/Makefile') }}
          restore-keys: |
            dl-${{ steps.src.outputs.commit }}-
            dl-

      - name: Compiler cache
        if: ${{ !inputs.clean_ccache }}
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.TARGET }}-${{ env.SUBTARGET }}-

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -type f -print -delete

      - name: Build
        working-directory: openwrt
        run: |
          set -o pipefail
          mkdir -p ../logs
          ccache -z >/dev/null 2>&1 || true
          echo "building with $(nproc) jobs"
          START=$(date +%s)
          if ! make -j"$(nproc)" > ../logs/build.log 2>&1; then
            echo "parallel build failed, rerunning single-threaded for the error"
            tail -50 ../logs/build.log
            make -j1 V=s > ../logs/build-v.log 2>&1 || {
              grep -n -B5 -A30 -E 'Error [0-9]|error:|ERROR' ../logs/build-v.log | tail -200
              exit 1; }
          fi
          echo "build took $(( ($(date +%s) - START) / 60 )) min"
          CCACHE_DIR=$PWD/.ccache ccache -s 2>/dev/null || true

      - name: Save the compiler cache
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ github.run_id }}

      # The base build already generated valid universal SD images.
      # DRAM profiles must change ONLY the SPL/U-Boot region, not the FIT
      # kernel, rootfs, or config. Re-running target/linux/install after
      # rebuilding U-Boot can replace the FIT with an initramfs kernel.
      - name: Images per DRAM profile
        working-directory: openwrt
        run: |
          set -euo pipefail
          OUT=bin/targets/$TARGET/$SUBTARGET
          IMG=../images
          mkdir -p "$IMG"
          PATCH=package/boot/uboot-sunxi/patches/430-dram-profile.patch
          ubootdir() {
            find build_dir/target-*/u-boot-radxa-cubie-a5e -maxdepth 0 -type d -print -quit
          }
          ubootcfg() {
            find build_dir/target-*/u-boot-radxa-cubie-a5e -maxdepth 2 -name .config -print -quit
          }
          ubootbin() {
            find build_dir/target-*/u-boot-radxa-cubie-a5e -maxdepth 2 -name u-boot-sunxi-with-spl.bin -type f -print -quit
          }
          save_config() {
            local name=$1 cfg
            cfg=$(ubootcfg)
            test -s "$cfg"
            grep -E '^CONFIG_DRAM_(CLK|SUNXI_TPR(6|10|11|12)(_ALT)?)=' "$cfg" | tee "$IMG/u-boot-dram-$name.txt"
          }
          save_config universal
          for f in "$OUT"/*radxa_cubie-a5e*-sdcard.img.gz; do
            b=$(basename "$f")
            cp "$f" "$IMG/${b/radxa_cubie-a5e/radxa_cubie-a5e-dram-universal}"
          done

          for conf in ../config/dram/*.conf; do
            name=$(basename "$conf" .conf)
            echo "::group::DRAM profile $name"
            python3 ../scripts/dram-profile-patch.py "$conf" "$PATCH"
            make package/boot/uboot-sunxi/clean >/dev/null
            make -j"$(nproc)" package/boot/uboot-sunxi/compile > "../logs/uboot-$name.log" 2>&1 ||
              { tail -100 "../logs/uboot-$name.log"; exit 1; }
            save_config "$name"
            for k in TPR6 TPR10 TPR11 TPR12; do
              want=$(sed -n "s/^$k=//p" "$conf")
              grep -qx "CONFIG_DRAM_SUNXI_$k=$want" "$IMG/u-boot-dram-$name.txt" ||
                { echo "U-Boot of $name lacks $k=$want"; exit 1; }
            done
            want=$(sed -n 's/^CLK=//p' "$conf"); want=${want:-936}
            grep -qx "CONFIG_DRAM_CLK=$want" "$IMG/u-boot-dram-$name.txt" ||
              { echo "U-Boot of $name lacks CONFIG_DRAM_CLK=$want"; exit 1; }

            uboot=$(ubootbin)
            test -s "$uboot" || { echo 'Missing rebuilt SPL/U-Boot'; exit 1; }
            uboot_size=$(stat -c%s "$uboot")
            test "$uboot_size" -le $((1024 * 1024 - 8192)) || {
              echo "SPL/U-Boot too large for the space before partition 1: $uboot_size bytes"
              exit 1
            }
            for fs in ext4 squashfs; do
              src=$(find "$IMG" -maxdepth 1 -type f -name "*-dram-universal-$fs-sdcard.img.gz" -print -quit)
              test -s "$src" || { echo "Missing universal $fs image"; exit 1; }
              dst=${src/-dram-universal-/-dram-$name-}
              raw=$(mktemp)
              gzip -dc "$src" > "$raw"
              dd if="$uboot" of="$raw" bs=1024 seek=8 conv=notrunc status=none
              gzip -n -9 -c "$raw" > "$dst"
              rm -f "$raw"
              test -s "$dst"
              echo "Created $dst (only SPL/U-Boot modified)"
            done
            echo "::endgroup::"
          done
          rm -f "$PATCH"
          cp "$OUT"/*radxa_cubie-a5e.manifest "$OUT"/*.buildinfo "$IMG/"
          (cd "$IMG" && sha256sum *.img.gz > sha256sums)
          ls -lh "$IMG"

      - name: Validate images
        working-directory: openwrt
        run: |
          python3 ../scripts/check-image.py --out ../images --profile "$PROFILE" \
            --build-dir "build_dir/target-${ARCH_PACKAGES}_musl" | tee ../logs/check-image.txt

      - name: Build info
        if: always()
        run: |
          {
            echo "repository: $GITHUB_REPOSITORY $GITHUB_SHA"
            echo "AIC8800 provenance (also in /etc/aic8800-origin):"
            cat openwrt/files/etc/aic8800-origin
            echo "openwrt: $OPENWRT_REPO ${{ steps.src.outputs.commit }}"
            cat feeds.revisions 2>/dev/null
            grep -H . openwrt/target/linux/generic/kernel-6.18 2>/dev/null
            echo "runner: ${{ inputs.runner || 'github' }} $(nproc) cpus"
          } > build-info.txt
          cat build-info.txt
          cp diffconfig.effective build-info.txt logs/ 2>/dev/null || true
          cp openwrt/.config logs/config.full 2>/dev/null || true
          df -h . | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: cubie-a5e-image
          if-no-files-found: error
          path: |
            images/
            build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cubie-a5e-packages
          if-no-files-found: error
          path: |
            openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/packages/
            openwrt/bin/packages/
