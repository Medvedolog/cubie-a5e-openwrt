name: Publish build

# Runs after every successful "Build image" run, so publishing never needs a
# rebuild:
#   main           -> pre-release cubie-a5e-snapshot-latest (rolling)
#   other branches -> pre-release cubie-a5e-test (test build, replaced on
#                     every run)
# The notes list the DRAM-profile images and which one to flash
# (scripts/release-notes.py, config/dram/*.conf), plus
# docs/releases/test-build.md for test builds. Fixed releases: release-tag.yml.
#
# By hand (Actions -> Publish build -> Run workflow): give the id of a
# successful build run.

on:
  workflow_run:
    workflows: ["Build image (OpenWrt from source)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Id of the build run to publish
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      # scripts and profile descriptions from the current default branch
      - uses: actions/checkout@v4

      - name: Which build
        id: run
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            ID=${{ inputs.run_id }}
          else
            ID=${{ github.event.workflow_run.id }}
          fi
          read -r BRANCH SHA CONCL ATTEMPT < <(gh api "repos/$R/actions/runs/$ID" \
            -q '[.head_branch, .head_sha, .conclusion, .run_attempt] | @tsv')
          test "$ATTEMPT" -ge 1
          test "$CONCL" = success || { echo "run $ID: $CONCL"; exit 1; }
          if [ "$BRANCH" = main ]; then
            TAG=cubie-a5e-snapshot-latest; KIND=latest
            TITLE="Cubie A5E OpenWrt snapshot ${SHA::7} (rolling)"
          else
            TAG=cubie-a5e-test; KIND=test
            TITLE="Test build ${SHA::7} ($BRANCH)"
          fi
          {
            echo "id=$ID"; echo "branch=$BRANCH"; echo "sha=$SHA"
            echo "tag=$TAG"; echo "kind=$KIND"; echo "title=$TITLE"
            echo "pkg_tag=cubie-a5e-pkgs-${SHA:0:12}-$ID-$ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          echo "run $ID ($BRANCH ${SHA::7}) -> $TAG"

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: art

      - name: Publish immutable signed APK repository
        run: |
          set -euo pipefail
          FEED=art/cubie-a5e-feed
          test -s "$FEED/packages.adb"
          test -s "$FEED/public-key.pem"
          test -s "$FEED/index.json"
          PKG_TAG="${{ steps.run.outputs.pkg_tag }}"

          # Verify every APK named by the signed index exists with its exact
          # original filename and SHA-256. GitHub Release assets normalize '~'
          # to '.', so they are NOT a valid APK repository transport.
          python3 - "$FEED" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          index = json.loads((root / "index.json").read_text())
          packages = index.get("packages", [])
          if len(packages) < 100:
              raise SystemExit(f"incomplete package index: {len(packages)} entries")
          names = set()
          for pkg in packages:
              name, version = pkg["name"], pkg["version"]
              filename = f"{name}-{version}.apk"
              if filename in names:
                  raise SystemExit(f"duplicate package filename: {filename}")
              names.add(filename)
              path = root / filename
              if not path.is_file():
                  raise SystemExit(f"missing indexed APK: {filename}")
              if path.stat().st_size != pkg["file-size"]:
                  raise SystemExit(f"size mismatch: {filename}")
          for required in ("nvme-cli", "libnvme", "kmod-nvme", "kmod-aic8800-sdio"):
              if not any(p["name"] == required for p in packages):
                  raise SystemExit(f"required package missing: {required}")
          apk_files = {p.name for p in root.glob("*.apk")}
          if apk_files != names:
              raise SystemExit(
                  f"APK set differs from index: extra={sorted(apk_files-names)}, "
                  f"missing={sorted(names-apk_files)}"
              )
          print(f"Verified {len(packages)} signed APK entries and original filenames")
          PY

          # Store each build in its own immutable directory on a dedicated
          # public branch. raw.githubusercontent.com preserves '~' exactly,
          # unlike the GitHub Releases upload endpoint.
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          git -C "$TMP" init -q
          git -C "$TMP" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${R}.git"
          if git -C "$TMP" ls-remote --exit-code origin refs/heads/apk-feed >/dev/null 2>&1; then
            git -C "$TMP" fetch -q --depth=1 origin refs/heads/apk-feed:refs/remotes/origin/apk-feed
            git -C "$TMP" checkout -q -B apk-feed refs/remotes/origin/apk-feed
          else
            git -C "$TMP" checkout -q --orphan apk-feed
          fi
          mkdir -p "$TMP/$PKG_TAG"
          if [ -d "$TMP/$PKG_TAG" ] && [ -n "$(find "$TMP/$PKG_TAG" -mindepth 1 -print -quit)" ]; then
            diff -qr "$FEED" "$TMP/$PKG_TAG" || {
              echo "::error::Immutable feed path already exists with different contents"
              exit 1
            }
            echo "Feed already published: $PKG_TAG"
          else
            cp -a "$FEED/." "$TMP/$PKG_TAG/"
            git -C "$TMP" add "$PKG_TAG"
            git -C "$TMP" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Publish immutable Cubie A5E APK feed $PKG_TAG"
            git -C "$TMP" push origin HEAD:refs/heads/apk-feed
          fi
          FEED_URL="https://raw.githubusercontent.com/$R/apk-feed/$PKG_TAG/packages.adb"
          curl --retry 12 --retry-delay 5 --retry-all-errors -fsSL "$FEED_URL" -o "$TMP/packages.adb"
          cmp "$FEED/packages.adb" "$TMP/packages.adb"
          echo "Published exact signed APK feed: $FEED_URL"

      - name: Assets and notes
        run: |
          find art -maxdepth 2 -type f | sed -n '1,50p'
          mkdir up
          cp art/cubie-a5e-image/images/*.img.gz art/cubie-a5e-image/images/sha256sums up/
          cp art/cubie-a5e-image/images/*.manifest up/ 2>/dev/null || true
          cp art/cubie-a5e-image/images/u-boot-dram-*.txt up/
          # the Wi-Fi driver and firmware, for "apk add" over the network
          find art/cubie-a5e-packages \( -name 'kmod-aic8800*.apk' -o -name 'aic8800-*firmware*.apk' \) \
            -exec cp {} up/ \;
          # A5E ImageBuilder is built from the same PR kernel and pinned to
          # its immutable APK feed, unlike the official OPiZ3 ImageBuilder.
          if [ -d art/cubie-a5e-imagebuilder ]; then
            cp art/cubie-a5e-imagebuilder/*.tar.zst up/
            cp art/cubie-a5e-imagebuilder/SHA256SUMS up/imagebuilder.sha256sums
          fi
          if [ -f art/cubie-a5e-feed/public-key.pem ]; then
            cp art/cubie-a5e-feed/public-key.pem up/cubie-a5e-apk-public-key.pem
          fi
          ls -la up
          dup=$(ls up | sort | uniq -d)
          [ -z "$dup" ] || { echo "duplicate asset names: $dup"; exit 1; }
          BASE="https://github.com/$R/releases/download/${{ steps.run.outputs.tag }}/"
          python3 scripts/release-notes.py --images up --dram-dir config/dram \
            --kind "${{ steps.run.outputs.kind }}" \
            --build-info art/cubie-a5e-image/build-info.txt --base-url "$BASE" > notes.md
          if [ -s art/cubie-a5e-feed/packages.adb ]; then
            {
              printf '\n## Signed APK packages and ImageBuilder\n\n'
              printf 'Immutable APK feed for exactly this image/kernel:\n'
              printf '`https://raw.githubusercontent.com/%s/apk-feed/%s/packages.adb`\n\n' \
                "$R" "${{ steps.run.outputs.pkg_tag }}"
              printf 'Firmware and ImageBuilder contain this pinned URL and matching public key.\n'
              printf 'Only packages built in this exact run are present; do not mix official Snapshot kmods.\n'
            } >> notes.md
          fi
          if [ "${{ steps.run.outputs.kind }}" = test ] && [ -f docs/releases/test-build.md ]; then
            printf '\n' >> notes.md
            cat docs/releases/test-build.md >> notes.md
          fi
          cat notes.md

      - name: Release
        run: |
          TAG=${{ steps.run.outputs.tag }}
          SHA=${{ steps.run.outputs.sha }}
          # the tag moves to the built commit; the release is replaced whole
          gh release delete "$TAG" -R "$R" -y --cleanup-tag 2>/dev/null || true
          for i in 1 2 3; do
            gh release create "$TAG" -R "$R" --prerelease --target "$SHA" \
              --title "${{ steps.run.outputs.title }}" --notes-file notes.md up/* && break
            [ "$i" = 3 ] && exit 1
            echo "release create failed, retrying in 20 s"; sleep 20
          done
          gh release view "$TAG" -R "$R" --json url,assets -q '.url, .assets[].name'
