name: Cubie A5E official-base snapshot + AIC8800 (signed bundles)

on:
  push:
    branches: [work/a5e-official-snapshot-aic8800]
    paths:
      - '.github/workflows/official-snapshot-aic8800.yml'
      - 'config/diffconfig.official-aic8800'
      - 'config/feeds.official-r38527.conf'
      - 'package/kernel/aic8800/**'
      - 'package/utils/aic8800-recovery/**'
      - 'package/luci/luci-app-a5e-board/**'
      - 'files/lib/aic8800.sh'
      - 'files/usr/sbin/aic8800-recover'
      - 'scripts/build-official-aic8800.sh'
      - 'scripts/check-official-aic8800.py'
      - 'scripts/prepare-official-aic8800-bundles.sh'
      - 'scripts/publish-official-aic8800-release.sh'
      - 'target/linux/sunxi/patches-6.18/950-arm64-dts-allwinner-a527-cubie-a5e-wifi-pwrseq.patch'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-a5e-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-a5e:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare OpenWrt build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison \
            gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget zstd \
            ccache device-tree-compiler mtools fdisk u-boot-tools libxml-parser-perl e2fsprogs
          # Avoid the host U-Boot dtc/libyaml conflict seen in this repo.
          if dpkg -s libyaml-dev >/dev/null 2>&1; then
            sudo apt-get remove -y libyaml-dev
          fi
      - name: Build pinned sunxi/cortexa53 image with AIC8800 and PM1 pwrseq
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
          OPENWRT_BUILD_ROOT: ${{ runner.temp }}/a5e-official-build
          OPENWRT_ARTIFACT_ROOT: ${{ github.workspace }}/build-official-a5e
        run: bash scripts/build-official-aic8800.sh pwrseq-950
      - name: Upload tested structure and untested binaries
        uses: actions/upload-artifact@v4
        with:
          name: a5e-r38527-pwrseq-950-UNTESTED
          path: build-official-a5e/pwrseq-950/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload matching ImageBuilder
        uses: actions/upload-artifact@v4
        with:
          name: a5e-r38527-imagebuilder
          path: build-official-a5e/imagebuilder/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload exact signed APK feed
        uses: actions/upload-artifact@v4
        with:
          name: a5e-r38527-signed-feed
          path: build-official-a5e/signed-feed/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload available build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5e-r38527-build-logs
          path: ${{ runner.temp }}/a5e-official-build/logs/
          if-no-files-found: ignore
          retention-days: 7

  publish-a5e-prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/a5e-official-snapshot-aic8800' && github.repository == 'Medvedolog/cubie-a5e-openwrt'
    needs: build-a5e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: a5e-r38527-pwrseq-950-UNTESTED
          path: verified-build/images
      - uses: actions/download-artifact@v4
        with:
          name: a5e-r38527-imagebuilder
          path: verified-build/imagebuilder
      - uses: actions/download-artifact@v4
        with:
          name: a5e-r38527-signed-feed
          path: verified-build/feed
      - name: Publish immutable signed package feed and a new pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-official-aic8800-release.sh verified-build/images verified-build/imagebuilder verified-build/feed
